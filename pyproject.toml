[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-isaac"
version = "0.1.0"
description = "SO-101 pen-in-bowl Isaac Lab task, scripted IK policy, and their Inspect Robots entry points"
requires-python = ">=3.10"
dependencies = [
    # Inspect Robots (https://github.com/robocurve/inspect-robots) and its Isaac Sim plugin
    "inspect-robots @ git+https://github.com/robocurve/inspect-robots",
    "inspect-robots-isaacsim @ git+https://github.com/robocurve/inspect-robots#subdirectory=plugins/inspect-robots-isaacsim",
    "numpy",
]

[tool.setuptools]
py-modules = ["so101_inspect", "ik_policy", "run_eval", "so101_kinematics", "pen_bowl_env", "so101_cfg"]

[project.entry-points."inspect_robots.policies"]
so101_ik = "so101_inspect:ik_policy"

[project.entry-points."inspect_robots.embodiments"]
so101_pen_bowl = "so101_inspect:pen_bowl_embodiment"

[project.entry-points."inspect_robots.tasks"]
so101-pen-in-bowl = "so101_inspect:pen_bowl_task"
